<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인폼연습</title>
  <script src="https://kit.fontawesome.com/632d3e2496.js" crossorigin="anonymous"></script>
  <style>
    *{margin:0; padding:0; box-sizing: border-box;}
    body{
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      color:#666;
      font-size:14px;
    }
    .login{
      position:fixed;
      inset:0;
      background-color:rgba(0,0,0,0.8);
      display:flex;
      justify-content: center;
    }
    .login > .container{
      margin-top:100px;
      width:300px;
      height:300px;
      background-color:#fff;
    }
    .close{
      border-bottom:1px solid #999;
      padding:10px;
      display:flex;      
      justify-content: flex-end;
    }
    .close > button{
      height:20px;
      background-color:transparent;
      border:none;
      font-size:20px;
      cursor:pointer;
      color:#666;
    }
    .login form{
      padding:20px 40px;
    }
    label{
      line-height:1.6;
    }
    input[type=text],
    input[type=password]{
      width:100%;
      height:40px;
      margin-bottom:20px;
      border:1px solid #999;
      text-indent: 10px;
      font-size:14px;
    }
    input[type=submit]{
      width:100%;
      height:30px;
      background-color:#111;
      color:#fff;
      border:none;
      font-size:14px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="login">
    <div class="container">
      <div class="close">
        <button><i class="far fa-times-circle"></i></button>
      </div>
      <form>
        <label for="user">사용자명 또는 이메일 주소</label>
        <input type="text" id="user" name="user">
        <label for="pw">암호</label>
        <input type="password" id="pw" name="pw">
        <input type="submit" value="로그인">
      </form>
    </div>
  </div>

  <section class="content">
    <h1>로그인 입력창을 만들어 보세요</h1>
  </section>
</body>
</html>
