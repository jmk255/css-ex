<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>border애니메이션</title>
  <style>
    body{
      margin-top:50px;
      text-align: center;
    }
    button{
      background:none;
      border:none;
      box-sizing:border-box;
      padding:1em 4em;
      /*inset:요소안쪽으로 그림자 표시, x축, y축, 흐림도, 확장값, 색상*/
      box-shadow:inset 0 0 0 2px orange;
      font-size:1.5em;
      color:orange;
      font-weight: bold;
      position:relative;
      transition:color 0.25s;
      cursor:pointer;
    }
    button::before,
    button::after{
      content:"";
      box-sizing: inherit;
      position:absolute;
      border:2px solid transparent;
      width:0; height:0;
    }
    /*기준 설정*/
    button::before{
      top:0; left:0;
    }
    button::after{
      bottom:0; right:0;
    }

    /*hover효과*/
    button:hover{color:navy;}
    button:hover::before,
    button:hover::after{
      width:100%; height:100%;
    }
    button:hover::before{
      border-top-color:navy;
      border-right-color:navy;
      transition: width 0.25s ease-out, height 0.25s ease-out 0.25s;
    }

    button:hover::after{
      border-bottom-color:navy;
      border-left-color:navy;
      transition:border-color 0s 0.5s, width 0.25s ease-out 0.5s,height 0.25s ease-out 0.75s;
    }
  </style>
</head>
<body>
  <button>Draw</button>
</body>
</html>
