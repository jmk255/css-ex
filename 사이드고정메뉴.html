<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사이드고정메뉴</title>
  <style>
    *{margin:0; padding:0; box-sizing: border-box;}
    ul,li{list-style:none;}
    a{text-decoration: none; color:inherit;}

    /*부드러운 스크롤 이동*/
    html,body{scroll-behavior:smooth;}
    
    header,
    section,
    footer{
      width:1000px;
      height:900px;
      margin:auto;
    }
    header{background-color:yellow;}
    section{background-color:lightgreen;}
    footer{background-color:skyblue;}

    /*고정메뉴*/
    .fixed_menu{
      position:fixed;/*브라우저의 특정위치로 고정시킬 수 있음*/
      width:80px;
      top:100px;
      /*가운데를 기준으로 정렬하면 브라우저의 사이즈가 조절되더라도 사이드 메뉴가 컨텐츠를 가리지 않는다*/
      left:50%;
      margin-left:500px;
      background-color:#ffff;
      text-align: center;
      font-size:14px;
      border:1px solid #999;
    }
    .title{
      width:100%;
      height:80px;
      padding:20px;
      background-color:#e4574d;
      color:#fff;
      font-weight: bold;
    }
    .btn a{
      display:block;
      width:100%;
      height:80px;
      padding:30px 0;
      color:#333;
      border-bottom:1px solid #999;
      transition: 0.3s;/*속성이 변경되면 0.3초에 걸쳐 변경됨*/
    }
    .btn a:hover{/*하이라이트효과*/
      background-color:salmon;
      color:#fff;
    }
    .btn li:last-child a{/*마지막 버튼요소 선택*/
      border-bottom:none;/*밑줄 제거*/
    }
    .top_btn{
      display:block;
      width:100%;
      height:60px;
      padding:20px;
      background-color:#e4574d;
      color:#fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="fixed_menu">
    <div class="title">
      Quick<br>
      MENU
    </div>
    <ul class="btn">
      <li><a href="#header">MENU</a></li>
      <li><a href="#content">MENU</a></li>
      <li><a href="#footer">MENU</a></li>
      <li><a href="#">MENU</a></li>
    </ul>
    <a href="#header" class="top_btn">TOP</a>
  </div>
  <header id="header"></header>
  <section id="content"></section>
  <footer id="footer"></footer>
</body>
</html>
