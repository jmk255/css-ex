<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    #notice {
      width: 1200px;
      margin: auto;
    }

    #notice>h1 {
      font-size: 36px;
      margin-bottom: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      /*셀과 셀사이의 여백을 제거*/
    }

    th {
      border-top: 2px solid #111;
      border-bottom: 1px solid #111;
      font-size: 16px;
      height: 60px;
    }

    td {
      border-bottom: 1px dotted #999;
      font-size: 14px;
    }

    td:first-child {
      padding: 20px 0 20px 44px;
      position: relative;
      /*pos:abs를 적용한 자식요소의 기준이됨*/
    }

    td:first-child::after {
      /*dot*/
      content: "";
      display: block;
      position: absolute;
      left: 20px;
      /*pos:abs적용할 경우 가운데 정렬(세로축)*/
      top: 50%;
      /* margin-top:-2px; */
      transform: translateY(-2px);
      /*======*/
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #111;
    }

    td:last-child {
      text-align: center;
    }

    /*pagination*/
    .pagination {
      width: 100%;
      margin-top: 20px;
      display:flex;
      justify-content: center;
    }
    .pagination a{
      display:block;
      padding:8px 16px;
      transition:0.3s;/*변환효과*/
    }
    .pagination .active{/*활성화*/
      background-color:#4caf50;
      color:#fff;
    }
    /*클래스가 active인 요소만 선택에서 제외*/
    .pagination a:hover:not(.active){/*하이라이트효과*/
      background-color:#ddd;
    }
  </style>
</head>

<body>
  <section id="notice">
    <h1>공지사항</h1>
    <table>
      <tr>
        <th>제목</th>
        <th>등록일</th>
      </tr>
      <tr>
        <td>서비스 종료에 따른 구매 이용약관 개정 안내</td>
        <td>26/05/29</td>
      </tr>
      <tr>
        <td>서비스 종료 안내</td>
        <td>26/05/27</td>
      </tr>
      <tr>
        <td>이용약관 개정 안내</td>
        <td>26/05/26</td>
      </tr>
      <tr>
        <td>[당첨자 발표] 뉴진스 팬사인회</td>
        <td>26/05/25</td>
      </tr>
      <tr>
        <td>[당첨자 발표] BTS 팬사인회 당첨자 안내드립니다.</td>
        <td>26/05/24</td>
      </tr>
    </table>
    <div class="pagination">
      <a href="#">&laquo;</a>
      <a href="#">1</a>
      <a href="#">2</a>
      <a class="active" href="#">3</a>
      <a href="#">4</a>
      <a href="#">5</a>
      <a href="#">6</a>
      <a href="#">&raquo;</a>
    </div>
  </section>
</body>

</html>
