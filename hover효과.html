<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hover효과</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap');
    *{
      margin:0; padding:0;
    }
    html,body{
      width:100%; height:100%;
      display:flex;
      flex-direction:column;/*세로 방향 정렬*/
      align-items: center;/*교차축 정렬*/
      justify-content: center;/*주축 정렬*/
      font-family: "Black Han Sans";
      font-size:2em;
      line-height:1;
      background-color:#2f2f2f;
    }
    span{
      cursor:pointer;
      color:transparent;/*글자색상은 투명*/
      -webkit-text-stroke:1px #f9f7f1;/*글자를 외곽선으로 표현*/
      background-image:linear-gradient(0deg, #f9f7f1, #f9f7f1);
      background-clip:text;/*텍스트 영역에만 그라디언트를 채움*/
      background-repeat: no-repeat;
      transition: background-size 0.2s ease-in;
    }

    span:hover{
      background-size:100% 100%;
    }

    .left{
      background-position:0;
      background-size:0 100%;
    }
    .right{
      background-position:100% 0;
      background-size:0 100%;
    }
    .top{
      background-position:0% 0%;
      background-size:100% 0%;
    }
    .bottom{
      background-position:0% 100%;
      background-size:100% 0%;
    }
    .center{
      background-position:50% 50%;
      background-size:0% 0%;
    }
  </style>
</head>

<body>
  <span class="left">ABOUT</span>
  <span class="right">WORKS</span>
  <span class="top">PRODUCT</span>
  <span class="bottom">BLOG</span>
  <span class="center">CONTACT</span>
</body>

</html>
