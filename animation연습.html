<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation연습</title>
  <style>
    *{margin:0; padding:0; box-sizing: border-box;}

    .container{
      width:800px;
      height:300px;
      background-color:#41c4b2;
      margin:auto;
      position:relative;
    }
    .pic_group{
      width:380px;
      height:100%;
      position:relative;
    }
    .pic_group > img{
      position:absolute;
    }
    .cloud{top:44px; left:40px;}
    .space_man{
      top:46px; left:0;
      animation:updown 3s linear infinite;
    }
    @keyframes updown {
      0%{transform:translateY(-40px);}
      50%{transform:translateY(20px);}
      100%{transform:translateY(-40px);}
    }
    .mars{
      top:48px; right:12px;
      animation:spin 3s linear infinite;
    }
    @keyframes spin {
      0%{transform:rotate(0deg);}
      50%{transform:rotate(30deg);}
      100%{transform:rotate(0deg);}
    }
    .txt{
      width:140px;
      position:absolute;
      right:90px;
      /*y축으로 가운데 정렬*/
      top:50%;
      transform:translateY(-50%);
      color:#fff;
    }
    .txt > h1{
      font-size:22px;
      font-weight: normal;
      letter-spacing: -1px;/*자간을 좁혀줍니다*/
    }
    .txt > p{
      font-size:12px;
      text-align: justify;/*글자를 해당영역에 꽉차게 정렬*/
      
      /*줄바꿈 방식을 제어*/
      word-break:break-all;/*단어 중간에서도 줄바꿈이됩니다*/

      margin:20px 0;
    }

    .txt > button{
      width:100%;
      height:40px;
      font-size:14px;
      color:#fff;
      background-color:transparent;
      border:2px solid #fff;
      letter-spacing: 1px;
    }
    .txt > button:hover{
      background-color:#fff;
      color:#41c4b2;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pic_group">
      <img class="cloud" src="img/cloud.png" alt="cloud">
      <img class="space_man" src="img/space_man.png" alt="spaceman">
      <img class="mars" src="img/mars.png" alt="mars">
    </div>
    <div class="txt">
      <h1>Space Tourism</h1>
      <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Odit facilis culpa quia voluptatibus vero alias impedit exercitationem aspernatur ratione </p>
      <button type="button">READ MORE</button>
    </div>
  </div>
</body>
</html>
