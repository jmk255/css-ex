<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position연습</title>
  <style>
    /*노말라이즈*/
    *{margin:0; padding:0; box-sizing: border-box;}
    ul,li{list-style:none;}
    a{text-decoration: none; color:inherit;}
    /*======================*/
    .container{
      width:100%;
      height:100vh;
      background:url(image/bg.png) center/cover;
      /*자식요소를 가운데정렬하기 위한 속성*/
      display:flex;
      justify-content: center;
      align-items:center;
      /*pos:abs를 적용한 자식요소의 기준이됨*/
      position:relative;
    }

    .logo img{
      display:block;
      margin:auto;/*가운데 정렬*/
    }
    .txt > p{
      font-size:18px;
      font-weight: bold;
      color:#fff;
      text-align: center;
      line-height:2.0;
      margin-top:60px;
    }
    .gnb{
      position:absolute;
      width:100%;
      height:80px;
      background-color:#331a51;
      left:0;
      bottom:0;/*pos:rel적용한 부모요소인 section의 하단으로 정렬*/
    }
    .gnb>ul{
      width:100%; height:100%;
      display:flex;
      justify-content: center;
      align-items: center;
      gap:110px;
    }
    .gnb a{
      color:#fff;
      font-size:14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <section class="container">
    <div class="txt">
      <h1 class="logo">
        <img src="image/logo.png" alt="logo">
      </h1>
      <p>
        Lorem, ipsum dolor sit amet<br>
        consectetur adipisicing elit. Distinctio
      </p>
    </div>
    <nav class="gnb">
      <ul>
        <li><a href="#">about</a></li>
        <li><a href="#">news</a></li>
        <li><a href="#">portfolio</a></li>
        <li><a href="#">board</a></li>
        <li><a href="#">album</a></li>
        <li><a href="#">contact</a></li>
      </ul>
    </nav>
  </section>
</body>
</html>
